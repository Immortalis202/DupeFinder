name: Release

# Releases are driven by the version in Cargo.toml. Bump it, push to main, and
# this publishes a release for it. Pushing a v* tag by hand also works.
#
# Note: a tag created by a workflow using the default GITHUB_TOKEN does not
# trigger other workflows, so tagging and building must happen in one workflow
# rather than tagging here and relying on an `on: push: tags` trigger elsewhere.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: decide
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Hand-pushed tag: it must agree with Cargo.toml, or the published
            # binaries would report a different --version than the release name.
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::tag $tag does not match Cargo.toml version $version"
              exit 1
            fi
            publish=true
          else
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag already released - nothing to do"
              publish=false
            else
              publish=true
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag publish=$publish"

  build:
    name: ${{ matrix.target }}
    needs: gate
    # Ordinary pushes to main that do not change the version build nothing.
    if: needs.gate.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: exe
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          staging="dupefind-${{ needs.gate.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/dupefind" "$staging/"
          cp README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      # Shipped as a bare .exe so it can be downloaded and run directly, with no
      # unzip step. .cargo/config.toml links the MSVC runtime statically, so it
      # does not need the Visual C++ Redistributable.
      - name: Package (Windows)
        if: matrix.archive == 'exe'
        shell: pwsh
        run: |
          $asset = "dupefind-${{ needs.gate.outputs.tag }}-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/dupefind.exe" $asset
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      # dumpbin is not on PATH without the VS dev shell, so scan the import
      # names directly: an imported DLL appears as an ASCII string in the file.
      - name: Confirm the .exe needs no redistributable
        if: matrix.archive == 'exe'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$env:ASSET")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match 'VCRUNTIME') {
            Write-Error "the .exe imports VCRUNTIME - crt-static did not apply, so it would need the VC++ Redistributable"
            exit 1
          }
          Write-Host "OK: no VCRUNTIME import - the .exe is self-contained"

      - uses: actions/upload-artifact@v7
        with:
          name: dupefind-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # One job creates the release, so the two build jobs cannot race to
      # create the same tag.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      # Creates the tag at this commit if it does not already exist.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: ${{ needs.gate.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
