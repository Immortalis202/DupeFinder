[package]
name = "dupefind"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for finding and removing duplicate files by content"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
directories = "6"
base64 = "0.22"
tempfile = "3"
ratatui = "0.30.2"
ignore = "0.4.33"
blake3 = "1.8.6"
rayon = "1.12"
crossbeam-channel = "0.5"
same-file = "1.0"
trash = "5.2"
humansize = "2.1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
